name: Breaker Strategy Tests
on:
  push:
    paths:
      - "breaker_strategy.py"
      - "test_breaker_strategy.py"
      - "breaker_paper_runner.py"
      - ".github/workflows/breaker-tests.yml"
  pull_request:
    paths:
      - "breaker_strategy.py"
      - "test_breaker_strategy.py"
      - "breaker_paper_runner.py"
      - ".github/workflows/breaker-tests.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run unit tests
        run: python -m unittest -v test_breaker_strategy
